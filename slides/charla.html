<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentes en Producción</title>
<style>
:root{--ink:#fff;--muted:#b9c6d4;--accent:#FF9900;--good:#5ee89a;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#05070a;color:var(--ink);overflow:hidden;
  font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
section{position:absolute;inset:0;display:none}
section.on{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0}
.scrim.l{background:linear-gradient(90deg,rgba(3,5,8,.94) 0%,rgba(3,5,8,.82) 38%,rgba(3,5,8,.15) 72%,rgba(3,5,8,.45) 100%)}
.scrim.b{background:linear-gradient(0deg,rgba(3,5,8,.95) 0%,rgba(3,5,8,.55) 42%,rgba(3,5,8,.1) 100%)}
.scrim.c{background:radial-gradient(ellipse at 50% 50%,rgba(3,5,8,.35) 0%,rgba(3,5,8,.88) 78%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 7vw;gap:2.4vh}
.wrap.bottom{justify-content:flex-end;padding-bottom:12vh}
.wrap.narrow{max-width:62%}
.kicker{color:var(--accent);font-size:clamp(11px,1.15vw,18px);font-weight:700;
  letter-spacing:.2em;text-transform:uppercase}
h1{font-size:clamp(40px,6.4vw,104px);line-height:.98;letter-spacing:-.035em;font-weight:800}
h2{font-size:clamp(30px,4.6vw,76px);line-height:1.02;letter-spacing:-.03em;font-weight:750;
  text-shadow:0 2px 30px rgba(0,0,0,.65)}
.sub{font-size:clamp(17px,2vw,32px);color:var(--muted);line-height:1.35;max-width:26ch;font-weight:400}
.name{font-size:clamp(15px,1.5vw,24px);color:#dbe6f0}
.nums{display:flex;gap:5vw;margin-top:1vh}
.num b{display:block;font-size:clamp(46px,8vw,132px);line-height:.9;letter-spacing:-.05em;font-weight:800}
.num span{display:block;font-size:clamp(13px,1.35vw,21px);color:var(--muted);margin-top:1.2vh}
.num.hot b{color:var(--accent)}
.term{background:rgba(3,6,10,.93);border:1px solid #2b3a4a;border-left:3px solid var(--accent);
  border-radius:10px;padding:2.4vh 2vw;font-family:"SF Mono",Menlo,Consolas,monospace;
  font-size:clamp(12px,1.25vw,20px);line-height:1.75;color:#d8e6f2;white-space:pre-wrap;
  box-shadow:0 30px 70px rgba(0,0,0,.6)}
.term .c{color:#6b7f95}.term .r{color:#ff6b6b;font-weight:700}
.term .g{color:#5ee89a;font-weight:600}.term .y{color:var(--accent)}
.three{display:flex;gap:2.4vw;margin-top:1vh}
.three div{font-size:clamp(14px,1.5vw,24px);color:var(--muted)}
.three b{color:#fff;display:block;font-size:clamp(17px,1.9vw,30px);margin-bottom:.5vh}
.ba{display:flex;gap:6vw;align-items:flex-end}
.ba .x{font-size:clamp(30px,5vw,80px);font-weight:800;letter-spacing:-.04em;line-height:1}
footer{position:fixed;bottom:2.2vh;left:7vw;right:7vw;display:flex;justify-content:space-between;
  font-size:clamp(10px,.95vw,14px);color:#5d6b7d;letter-spacing:.05em;z-index:4}
#notes{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:2px solid var(--accent);
  padding:14px 7vw;font-size:15px;line-height:1.5;color:#dbe6f0;display:none;max-height:36vh;overflow:auto;z-index:6}
#notes.on{display:block}#notes b{color:var(--accent)}
.bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .25s;z-index:5}
.diagwrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:4.5vh 5vw 8vh;gap:1.2vh}
.diagwrap .fill{flex:1;display:flex;align-items:center;min-height:0}
svg.diag{width:100%;height:100%;max-height:100%}
.t{fill:#f2f6fa;font-family:Inter,sans-serif;font-size:15px;font-weight:600}
.s{fill:#93a4b8;font-family:Inter,sans-serif;font-size:12.5px}
.s2{fill:#6f8098;font-family:Inter,sans-serif;font-size:11.5px;letter-spacing:.06em}
.box{fill:url(#gcard);stroke:#303d4d;stroke-width:1.4}
.ln{stroke:#3c4a5c;stroke-width:1.8;fill:none}
.lna{stroke:#FF9900;stroke-width:2.2;fill:none}
.lng{stroke:#4ade80;stroke-width:2.2;fill:none}
.grp{fill:none;stroke-width:1.6;stroke-dasharray:7 5}

.an{opacity:0}
section.on .an{animation:rise .55s cubic-bezier(.2,.75,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
section.on .draw{stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300);
  animation:draw .7s ease-out both;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
section.on .bg{animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
.tb{fill:#f2f6fa;font-family:Inter,sans-serif;font-size:19px;font-weight:700}

.hu{fill:#fff;font-family:Inter,sans-serif;font-size:76px;font-weight:800;letter-spacing:-.04em}
.tb{fill:#f2f6fa;font-family:Inter,sans-serif;font-size:21px;font-weight:700}
.mn{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#d8e6f2}
.lnn{stroke:#3c4a5c;stroke-width:1.8;fill:none}
.lnr{stroke:#f87171;stroke-width:2;fill:none}
.lng{stroke:#4ade80;stroke-width:2;fill:none}
.lbl{fill:#93a4b8;font-family:Inter,sans-serif;font-size:26px;font-weight:500}

.lb1{fill:#fff;font-family:Inter,sans-serif;font-size:40px;font-weight:700;letter-spacing:-.02em}
.lb2{fill:#f2f6fa;font-family:Inter,sans-serif;font-size:24px;font-weight:600}
.lb3{fill:#93a4b8;font-family:Inter,sans-serif;font-size:20px;font-weight:400}
.frm{font-family:Inter,sans-serif;font-size:52px;font-weight:700;letter-spacing:-.02em}
.mn2{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:26px;font-weight:600}
.mn3{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:26px}

.lb4{fill:#f2f6fa;font-family:Inter,sans-serif;font-size:17px;font-weight:600}
.lb5{fill:#93a4b8;font-family:Inter,sans-serif;font-size:14px;font-weight:400}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px, rgba(148,170,196,.14) 1px, transparent 0);
  background-size:34px 34px;mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 20%,transparent 78%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(52vw 42vw at 88% -8%, rgba(255,153,0,.13), transparent 62%),
    radial-gradient(46vw 38vw at -6% 104%, rgba(90,130,255,.11), transparent 62%),
    radial-gradient(ellipse 120% 90% at 50% 50%, transparent 42%, rgba(0,0,0,.55) 100%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-2.5%,1.8%,0) scale(1.05)}}
section{z-index:1}
.diagwrap{position:relative;z-index:1}
.kicker{position:relative;padding-left:16px}
.kicker::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 12px rgba(255,153,0,.9)}
.lna,.lng,.lnr{filter:drop-shadow(0 0 5px rgba(255,153,0,.28))}
.lng{filter:drop-shadow(0 0 5px rgba(74,222,128,.3))}
.lnr{filter:drop-shadow(0 0 5px rgba(221,52,76,.32))}
.hu{paint-order:stroke;filter:drop-shadow(0 6px 26px rgba(0,0,0,.65))}
.src{fill:#5a6b80;font-family:Inter,sans-serif;font-size:13px;letter-spacing:.04em}
.chip{fill:#93a4b8;font-family:Inter,sans-serif;font-size:14px;font-weight:600}
@media print{body{overflow:visible}section{display:block!important;position:relative;height:100vh;page-break-after:always}#notes,footer,.bar{display:none}}
</style>
</head>

<section data-notes="<b>3:40–5:30</b> · La lámina central: la arquitectura real en AWS. Recorrela en cuatro tiempos. UNO, afuera de la nube: el agente corre en la terminal del operador con un rol de solo lectura, y el pipeline de GitHub Actions entra por OIDC, sin ninguna llave de larga duración guardada. DOS, el borde: Route 53 y el balanceador en las subredes públicas, una por zona de disponibilidad. TRES, la capa de cómputo: los microservicios en ECS Fargate, en subredes privadas, sin IP pública. CUATRO, la capa de datos, también privada: Aurora para relacional, DocumentDB para documental, ElastiCache con Valkey para caché, OpenSearch para búsqueda y MSK para streaming. A la derecha, los servicios que atraviesan todo: CloudWatch para logs y métricas, Secrets Manager para las credenciales que el agente nunca ve, S3 para el estado de Terraform e IAM, que es el guardarraíl real. Y el punto que quiero que se lleven: el agente no tiene una llave de nada. Asume un rol, ese rol es de solo lectura, y cada escritura necesita una autorización explícita y entra por Terraform.">

    <div class="kicker an">Arquitectura en AWS</div>

      <!-- fuera de la nube -->

<section data-notes="<b>5:00–5:50</b> · Esto es lo que convierte un modelo en un operador, y está todo público en el repositorio. CLAUDE.md son las reglas duras que se cargan en cada sesión: qué herramienta va primero y qué está prohibido. MEMORY.md más la carpeta memory son un índice corto y un archivo por tema, con los incidentes, las lecciones y las correcciones del operador, cada una con su porqué. La carpeta skills son los runbooks: un procedimiento por situación. Commands son los comandos del día a día. Y el mcp.json define cómo se conectan las herramientas: el secreto se lee del entorno al ejecutar, nunca está en el archivo. Todo esto es texto plano versionado en git: se revisa en un pull request, se audita y se revierte como cualquier código.">

<section data-notes="<b>5:50–6:50</b> · Cómo el agente encuentra el procedimiento correcto. Los documentos del equipo se parten en fragmentos, cada fragmento se convierte en un vector que representa su significado, y eso se guarda en Qdrant. Después, la pregunta del operador se convierte en un vector y se comparan significados, no palabras. Mirá la consulta: la pregunta dice 'el servicio se reinicia todo el tiempo' y encuentra el runbook de crash loop en ECS con un score de 0.60. La pregunta no contenía ninguna palabra del documento. Eso es lo que separa esto de un buscador de texto. Un detalle técnico que importa: se indexa por fragmentos y no documentos enteros, porque un documento largo en un solo vector se diluye y deja de recuperarse.">

<section data-notes="<b>7:50–8:40</b> · Dos casos reales, anonimizados. Kafka: dos de tres brokers caídos por disco lleno. La retención estaba configurada y no se aplicaba nunca, porque con segmentos de 256 megas el segmento activo no rotaba, y la retención solo borra segmentos ya cerrados. Se amplió el disco para recuperar el cluster, se corrigió la configuración de segmentos, y quedó en tres de tres con cero particiones sub-replicadas. MongoDB: tres nodos entre 89 y 95 por ciento de disco. Un buffer huérfano de 30 gigas y una colección de 52 millones de documentos sin política de retención. Se respaldaron los índices antes de tocar nada, purga por lotes y compactación nodo por nodo empezando por un secundario. Quedó en 55 por ciento, sin perder un dato.">

<script>
const S=[...document.querySelectorAll('section')];let i=0,notesOn=false;
const notes=document.getElementById('notes');
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  S.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('fnum').textContent=(i+1)+' / '+S.length;
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  notes.innerHTML=S[i].dataset.notes||'';location.hash=i+1;
}
addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){show(i+1);e.preventDefault();}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){show(i-1);e.preventDefault();}
  else if(e.key==='Home')show(0); else if(e.key==='End')show(S.length-1);
  else if(e.key.toLowerCase()==='n'){notesOn=!notesOn;notes.classList.toggle('on',notesOn);}
  else if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();
});
addEventListener('click',e=>{if(!notes.contains(e.target))show(i+1);});
show(parseInt(location.hash.slice(1))-1||0);
</script>
