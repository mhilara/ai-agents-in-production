name: deploy

# Flujo real: push a main -> el pipeline aplica IaC. Sin PRs, sin clicks,
# sin llaves de larga duracion: GitHub se autentica con OIDC.
on:
  push:
    branches: [main]
    paths:
      - 'demo/terraform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # necesario para OIDC
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Asumir el rol de CI por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Quien soy
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - run: terraform plan -input=false -no-color

      - name: Aplicar el estado declarado
        run: terraform apply -input=false -auto-approve

      - name: Verificar que el servicio quedo sano
        run: |
          aws ecs wait services-stable \
            --cluster dataplat-prod --services ingest-api --region us-east-2
          aws ecs describe-services --cluster dataplat-prod --services ingest-api \
            --region us-east-2 \
            --query 'services[0].{running:runningCount,desired:desiredCount,taskdef:taskDefinition}'
